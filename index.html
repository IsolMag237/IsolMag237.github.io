<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; 
        }

        /* --- 1. PANTALLA DE INTRO (GIF) --- */
        #pantalla-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #gif-intro {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- 2. CONTENIDO DEL LOGIN --- */
        #contenido-login {
            opacity: 0;
            transition: opacity 1.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* NUEVO: Video ambiental de fondo detrás de la interfaz */
        .video-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1; /* Se queda al fondo de todo */
            pointer-events: none;
        }

        /* El cuadro contenedor (Ahora usa tu archivo .png) */
        .cuadro-interfaz {
            position: relative;
            width: 500px;  
            height: 375px; 
            background-image: url('Inicio de Sesion.png'); /* Nombre exacto de tu imagen */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            z-index: 10; /* Se posiciona por delante del video de fondo */
        }

        /* Capa transparente del formulario */
        .formulario-capa {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Cajas de texto invisibles sobre la madera */
        .campo-entrada {
            position: absolute;
            background: transparent; 
            border: none;
            outline: none;
            color: #fcd34d; /* Texto dorado pixel */
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            padding: 5px 10px;
            user-select: text; 
        }

        /* Posición exacta sobre USUARIO */
        #usuario {
            top: 31%;
            left: 15.5%;
            width: 69%;
            height: 11%;
        }

        /* Posición exacta sobre CONTRASEÑA */
        #contrasena {
            top: 54.5%;
            left: 15.5%;
            width: 69%;
            height: 11%;
        }

        /* Botones invisibles interactivos */
        .boton-interactivo {
            position: absolute;
            background: rgba(255, 255, 255, 0); 
            border: none;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        /* Brillo sutil al pasar el cursor */
        .boton-interactivo:hover {
            background: rgba(255, 255, 255, 0.12); 
        }

        /* Encaja sobre el botón azul "INICIAR SESIÓN" */
        #btn-iniciar {
            bottom: 9.5%;
            left: 8.5%;
            width: 41%;
            height: 13.5%;
        }

        /* Encaja sobre el botón gris "CANCELAR" */
        #btn-cancelar {
            bottom: 9.5%;
            right: 8.5%;
            width: 41%;
            height: 13.5%;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE INTRO -->
    <div id="pantalla-intro">
        <img id="gif-intro" src="intro.gif" alt="Cargando...">
    </div>

    <!-- 2. INTERFAZ DE LOGIN -->
    <div id="contenido-login">
        
        <!-- NUEVO: Tu video de fondo reproduciéndose automáticamente -->
        <video class="video-fondo" src="video_1772677728570.mp4" autoplay loop muted playsinline></video>

        <!-- Cuadro de madera interactivo -->
        <div class="cuadro-interfaz">
            <form class="formulario-capa" id="formLogin">
                
                <!-- Inputs sobre la madera -->
                <input type="text" id="usuario" class="campo-entrada" autocomplete="off" required>
                <input type="password" id="contrasena" class="campo-entrada" required>
                
                <!-- Botones sobre la imagen -->
                <button type="submit" id="btn-iniciar" class="boton-interactivo" title="Iniciar Sesión"></button>
                <button type="button" id="btn-cancelar" class="boton-interactivo" title="Cancelar" onclick="cancelar()"></button>
            </form>
        </div>

    </div>

    <!-- 3. LÓGICA EN JAVASCRIPT -->
    <script>
        // --- Control de la Intro ---
        window.addEventListener('load', () => {
            const tiempoDeIntro = 3500; 

            setTimeout(() => {
                const intro = document.getElementById('pantalla-intro');
                const login = document.getElementById('contenido-login');

                intro.style.opacity = '0';
                intro.style.visibility = 'hidden';

                // Aparece el login con su video de fondo
                login.style.opacity = '1';
            }, tiempoDeIntro);
        });

        // --- Validación de Acceso ---
        document.getElementById('formLogin').addEventListener('submit', (e) => {
            e.preventDefault(); 
            
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('contrasena').value;

            // Claves de acceso (admin / 1234)
            if(user === "admin" && pass === "1234") {
                alert("¡Acceso concedido!");
                window.location.href = "principal.html"; // Te envía a la pantalla de los 3 videos elásticos
            } else {
                alert("Usuario o contraseña incorrectos. Inténtalo de nuevo.");
            }
        });

        // Botón Cancelar (Limpia los campos escritos)
        function cancelar() {
            document.getElementById('usuario').value = '';
            document.getElementById('contrasena').value = '';
        }
    </script>

</body>
</html>
