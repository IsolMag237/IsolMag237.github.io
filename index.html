<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web Interactivo - Navegación</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a; 
            color: #f8fafc;
            overflow: hidden; 
        }

        /* --- PANTALLA DE INTRO (GIF) --- */
        #pantalla-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #gif-intro {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        #contenido-principal {
            opacity: 0;
            transition: opacity 1.2s ease;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Títulos superiores flotantes */
        .encabezado {
            padding: 20px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(15,23,42,1), rgba(15,23,42,0));
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            box-sizing: border-box;
            pointer-events: none; /* Hace que el texto no interfiera con los clics de los videos */
        }

        h1 { margin: 0 0 5px 0; font-size: 2rem; color: #fff; }
        .subtitulo { margin: 0; color: #94a3b8; font-size: 1rem; }

        /* --- CONTENEDOR ELÁSTICO --- */
        .contenedor-botones {
            display: flex;
            width: 100%;
            height: 100vh; 
            align-items: stretch; 
            gap: 0; 
        }

        /* --- ESTILO BASE DE LOS ENLACES/BOTONES --- */
        .enlace-panel {
            flex: 1; /* Cada uno inicia ocupando el 33.33% de la pantalla */
            background: #000;
            text-decoration: none; /* Elimina cualquier línea de enlace de texto por defecto */
            position: relative;
            overflow: hidden;
            cursor: pointer;
            /* Transición fluida para el efecto de empuje elástico */
            transition: flex 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Línea sutil divisoria entre los paneles */
        .enlace-panel:not(:last-child) {
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* --- EFECTO ELÁSTICO (HOVER) --- */
        /* El panel seleccionado se expande */
        .contenedor-botones:hover .enlace-panel:hover {
            flex: 2.2; 
        }

        /* Los otros dos paneles se aplastan y se opacan */
        .contenedor-botones:hover .enlace-panel:not(:hover) {
            flex: 0.4; 
            opacity: 0.3; 
            filter: grayscale(50%);
            transition: flex 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, filter 0.4s ease;
        }

        /* El video se adapta al tamaño del panel elástico */
        .enlace-panel video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE INTRO -->
    <div id="pantalla-intro">
        <img id="gif-intro" src="intro.gif" alt="Cargando...">
    </div>

    <!-- 2. CONTENIDO PRINCIPAL -->
    <div id="contenido-principal">
        
        <div class="encabezado">
            <h1>Explora el Contenido</h1>
            <p class="subtitulo">Pasa el cursor para expandir. Haz clic para entrar.</p>
        </div>

        <!-- CONTENEDOR ELÁSTICO CON ENLACES -->
        <div class="contenedor-botones">

            <!-- Panel 1: Cambia el 'href' por la web que quieras -->
            <a href="https://es.pornhub.com/" class="enlace-panel">
                <video src="videoboton1.mp4" loop muted preload="metadata" poster="imagenboton1.webp"></video>
            </a>

            <!-- Panel 2: Cambia el 'href' por la web que quieras -->
            <a href="https://motionmuse.ai/r/4rbhac00" class="enlace-panel">
                <video src="videoboton2.mp4" loop muted preload="metadata" poster="imagenboton2.webp"></video>
            </a>

            <!-- Panel 3: Cambia el 'href' por la web que quieras -->
            <a href="https://www.reddit.com/r/GOONED/" class="enlace-panel">
                <video src="videoboton3.mp4" loop muted preload="metadata" poster="imagenboton3.webp"></video>
            </a>

        </div>
    </div>

    <!-- 3. LÓGICA JAVASCRIPT -->
    <script>
        // --- Control de la Intro ---
        window.addEventListener('load', () => {
            const tiempoDeIntro = 3500; 
            setTimeout(() => {
                const intro = document.getElementById('pantalla-intro');
                const contenido = document.getElementById('contenido-principal');
                intro.style.opacity = '0';
                intro.style.visibility = 'hidden';
                contenido.style.opacity = '1';
            }, tiempoDeIntro);
        });

        // --- Control de Reproducción de Video ---
        const paneles = document.querySelectorAll('.enlace-panel');

        paneles.forEach(panel => {
            const video = panel.querySelector('video');

            panel.addEventListener('mouseenter', () => {
                video.play().catch(e => console.log(e));
            });

            panel.addEventListener('mouseleave', () => {
                video.pause();
                // Reseteo rápido para forzar la visualización de la imagen de portada
                const srcOriginal = video.src;
                video.src = '';
                video.load();
                video.src = srcOriginal;
            });
        });
    </script>

</body>
</html>
