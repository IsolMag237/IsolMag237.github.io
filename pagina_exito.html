<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Principal - Acceso Concedido</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19; /* Fondo azul noche profundo */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
        }

        /* Contenedor central estilo logro de videojuego */
        .contenedor-exito {
            text-align: center;
            padding: 40px;
            background-color: #111827;
            border: 6px solid #10b981; /* Borde verde de éxito */
            box-shadow: 0 0 20px #10b981, inset 0 0 10px rgba(16, 185, 129, 0.5);
            max-width: 600px;
            width: 90%;
        }

        .icono-candado {
            font-size: 40px;
            color: #10b981;
            margin-bottom: 25px;
            animation: pulso 2s infinite ease-in-out;
        }

        h1 {
            font-size: 18px;
            color: #10b981;
            margin-bottom: 20px;
            line-height: 1.6;
            text-shadow: 2px 2px #000;
        }

        p {
            font-size: 10px;
            color: #9ca3af;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        /* Botón estilo retro para salir */
        .btn-regresar {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #ffffff;
            background-color: #374151;
            padding: 15px 25px;
            border: 4px solid #1f2937;
            box-shadow: inset -4px -4px 0 #111827, inset 4px 4px 0 #4b5563;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-regresar:active {
            transform: scale(0.95);
            box-shadow: inset 4px 4px 0 #111827;
        }

        @keyframes pulso {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px #10b981); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 15px #10b981); }
            100% { transform: scale(1); filter: drop-shadow(0 0 2px #10b981); }
        }
    </style>
</head>
<body>

    <div class="contenedor-exito">
        <div class="icono-candado">🔓</div>
        <h1>¡ACCESO CONCEDIDO!</h1>
        <p>Bienvenido al panel principal de la base de datos. Has iniciado sesión de manera correcta y segura.</p>
        
        <!-- Enlace para desloguearse y volver al inicio de sesión -->
        <a href="index.html" class="btn-regresar">CERRAR SESIÓN</a>
    </div>

</body>
</html>
