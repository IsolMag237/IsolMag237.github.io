<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web Interactivo - Efecto Elástico</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a; 
            color: #f8fafc;
            overflow: hidden; /* Mantiene la pantalla fija sin barras de scroll */
        }

        /* --- PANTALLA DE INTRO (GIF) --- */
        #pantalla-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #gif-intro {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        #contenido-principal {
            opacity: 0;
            transition: opacity 1.2s ease;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Títulos superiores flotantes */
        .encabezado {
            padding: 20px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(15,23,42,1), rgba(15,23,42,0));
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            box-sizing: border-box;
        }

        h1 { margin: 0 0 5px 0; font-size: 2rem; color: #fff; }
        .subtitulo { margin: 0; color: #94a3b8; font-size: 1rem; }

        /* --- CONTENEDOR ELÁSTICO (Ocupa toda la pantalla de lado a lado) --- */
        .contenedor-botones {
            display: flex;
            width: 100%;
            height: 100vh; /* Ocupa todo el alto de la pantalla */
            align-items: stretch; /* Estira los botones verticalmente de arriba a abajo */
            gap: 0; /* Sin separaciones para que el efecto de empuje sea continuo */
        }

        /* --- ESTILO BASE DE LOS BOTONES (Cada uno inicia con 33.33%) --- */
        .boton-video {
            flex: 1; /* Reparte el espacio equitativamente (33% cada uno) */
            background: #000;
            border: none;
            padding: 0;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            /* La magia de la transición: el cambio de 'flex' tardará 0.6 segundos de manera ultra fluida */
            transition: flex 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Añadimos una línea sutil brillante para separar los botones de fondo */
        .boton-video:not(:last-child) {
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* --- LA MAGIA DEL EFECTO: AL PASAR EL CURSOR (HOVER) --- */
        /* El botón seleccionado se expande drásticamente */
        .contenedor-botones:hover .boton-video:hover {
            flex: 2.2; /* Crece más del doble de su tamaño original */
        }

        /* Al mismo tiempo, los botones que NO tienen el cursor encima se aplastan */
        .contenedor-botones:hover .boton-video:not(:hover) {
            flex: 0.4; /* Se encogen fuertemente abriendo paso al seleccionado */
            opacity: 0.4; /* Se opacan ligeramente para dar protagonismo al del centro */
            filter: grayscale(40%); /* Pierden un poco de color al aplastarse */
            transition: flex 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, filter 0.4s ease;
        }

        /* El video dentro de cada botón ocupará siempre el 100% disponible */
        .boton-video video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Garantiza que el video llene el área elástica sin deformarse */
            display: block;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE INTRO -->
    <div id="pantalla-intro">
        <img id="gif-intro" src="intro.gif" alt="Cargando...">
    </div>

    <!-- 2. CONTENIDO PRINCIPAL -->
    <div id="contenido-principal">
        
        <div class="encabezado">
            <h1>Explora el Contenido</h1>
            <p class="subtitulo">Pasa el cursor por las secciones para expandirlas</p>
        </div>

        <!-- CONTENEDOR ELÁSTICO -->
        <div class="contenedor-botones">

            <!-- Botón Izquierdo (Se estira a la derecha aplastando al medio y derecho) -->
            <button class="boton-video">
                <video src="videoboton1.mp4" loop muted preload="metadata" poster="imagenboton1.webp"></video>
            </button>

            <!-- Botón del Medio (Se estira a ambos lados aplastando a las esquinas) -->
            <button class="boton-video">
                <video src="videoboton2.mp4" loop muted preload="metadata" poster="imagenboton2.webp"></video>
            </button>

            <!-- Botón Derecho (Se estira a la izquierda aplastando al medio e izquierdo) -->
            <button class="boton-video">
                <video src="videoboton3.mp4" loop muted preload="metadata" poster="imagenboton3.webp"></video>
            </button>

        </div>
    </div>

    <!-- 3. LÓGICA JAVASCRIPT -->
    <script>
        // --- Control de la Intro ---
        window.addEventListener('load', () => {
            const tiempoDeIntro = 3500; 
            setTimeout(() => {
                const intro = document.getElementById('pantalla-intro');
                const contenido = document.getElementById('contenido-principal');
                intro.style.opacity = '0';
                intro.style.visibility = 'hidden';
                contenido.style.opacity = '1';
            }, tiempoDeIntro);
        });

        // --- Control de Reproducción de Video (Estilo YouTube) ---
        const botones = document.querySelectorAll('.boton-video');

        botones.forEach(boton => {
            const video = FindVideo = boton.querySelector('video');

            boton.addEventListener('mouseenter', () => {
                video.play().catch(e => console.log(e));
            });

            boton.addEventListener('mouseleave', () => {
                video.pause();
                // Reseteo rápido para volver a pintar la portada .webp
                const srcOriginal = video.src;
                video.src = '';
                video.load();
                video.src = srcOriginal;
            });
        });
    </script>

</body>
</html>
