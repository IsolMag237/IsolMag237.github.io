<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web Interactivo - Modo Enfoque</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a; 
            color: #f8fafc;
            overflow: hidden; 
        }

        /* --- PANTALLA DE INTRO (GIF) --- */
        #pantalla-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #gif-intro {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- FONDO OSCURO PARA OPACAR (Capa fantasma) --- */
        #capa-oscura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85); /* Opaca fuertemente el fondo */
            z-index: 50;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        /* Cuando la capa está activa */
        #capa-oscura.activa {
            opacity: 1;
            visibility: visible;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        #contenido-principal {
            opacity: 0;
            transition: opacity 1.2s ease;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
            color: #fff;
        }

        .subtitulo {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 40px;
            text-align: center;
        }

        /* --- CONTENEDOR DE BOTONES --- */
        .contenedor-botones {
            display: flex;
            gap: 30px; 
            justify-content: center;
            align-items: center;
            flex-wrap: wrap; 
            max-width: 1200px;
            width: 100%;
        }

        /* --- ESTILO BASE DE LOS BOTONES --- */
        .boton-video {
            background: none;
            border: 3px solid #334155;
            padding: 0;
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            width: 320px;     
            height: 180px;    
            position: relative;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            /* Transiciones separadas para que la animación al expandirse sea fluida */
            transition: transform 0.3s ease, border-color 0.3s ease, width 0.4s ease, height 0.4s ease, box-shadow 0.3s ease;
        }

        /* Vista normal: Al pasar el cursor encima */
        .boton-video:not(.expandido):hover {
            transform: scale(1.08); 
            border-color: #38bdf8;  
        }

        /* Ajuste inicial del video (recortado para miniatura estandarizada) */
        .boton-video video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        /* --- NUEVO: EFECTO MODO TEATRO / EXPANDIDO --- */
        .boton-video.expandido {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1); /* Lo clava en el centro exacto */
            width: 80vw;         /* Toma el 80% del ancho de la pantalla */
            height: 80vh;        /* Toma el 80% del alto de la pantalla */
            max-width: 1000px;   /* Límite para que no se deforme en pantallas gigantes */
            max-height: 562px;   /* Mantiene proporción cinematográfica */
            z-index: 100;        /* Se posiciona por encima de la capa oscura */
            border-color: #38bdf8;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            cursor: zoom-out;    /* El cursor cambia para indicar que se puede encoger */
        }

        /* Cuando está expandido, el video NO debe cortarse */
        .boton-video.expandido video {
            object-fit: contain; /* Muestra el video completo en sus proporciones reales */
            background-color: #000; /* Fondo negro por si el formato del video deja franjas */
        }
    </style>
</head>
<body>

    <!-- Capa oscura de fondo (para opacar la pantalla) -->
    <div id="capa-oscura"></div>

    <!-- 1. PANTALLA DE INTRO -->
    <div id="pantalla-intro">
        <img id="gif-intro" src="intro.gif" alt="Cargando...">
    </div>

    <!-- 2. CONTENIDO PRINCIPAL -->
    <div id="contenido-principal">
        <h1>Explora el Contenido</h1>
        <p class="subtitulo">Pasa el cursor para previsualizar. ¡Haz clic para expandir en grande!</p>

        <div class="contenedor-botones">

            <!-- Botón 1 -->
            <button class="boton-video">
                <video src="videoboton1.mp4" loop muted preload="metadata" poster="imagenboton1.webp"></video>
            </button>

            <!-- Botón 2 -->
            <button class="boton-video">
                <video src="videoboton2.mp4" loop muted preload="metadata" poster="imagenboton2.webp"></video>
            </button>

            <!-- Botón 3 -->
            <button class="boton-video">
                <video src="videoboton3.mp4" loop muted preload="metadata" poster="imagenboton3.webp"></video>
            </button>

        </div>
    </div>

    <!-- 3. LÓGICA JAVASCRIPT -->
    <script>
        // --- Control de la Intro ---
        window.addEventListener('load', () => {
            const tiempoDeIntro = 3500; 
            setTimeout(() => {
                const intro = document.getElementById('pantalla-intro');
                const contenido = document.getElementById('contenido-principal');
                intro.style.opacity = '0';
                intro.style.visibility = 'hidden';
                contenido.style.opacity = '1';
                document.body.style.overflow = 'auto';
            }, tiempoDeIntro);
        });

        // --- Control de Botones Expandibles ---
        const botones = document.querySelectorAll('.boton-video');
        const capaOscura = document.getElementById('capa-oscura');

        // Función para encoger el video que esté abierto
        function cerrarVideoExpandido() {
            botones.forEach(b => {
                if (b.classList.contains('expandido')) {
                    b.classList.remove('expandido');
                    const video = b.querySelector('video');
                    // Al cerrarse, pausamos y reseteamos el video a su imagen estática
                    video.pause();
                    const srcOriginal = video.src;
                    video.src = '';
                    video.load();
                    video.src = srcOriginal;
                }
            });
            capaOscura.classList.remove('activa');
        }

        botones.forEach(boton => {
            const video = boton.querySelector('video');

            // 1. Al pasar el cursor (solo si no está expandido ya)
            boton.addEventListener('mouseenter', () => {
                if (!boton.classList.contains('expandido')) {
                    video.play().catch(e => console.log(e));
                }
            });

            // 2. Al quitar el cursor (solo si no está expandido)
            boton.addEventListener('mouseleave', () => {
                if (!boton.classList.contains('expandido')) {
                    video.pause();
                    const srcOriginal = video.src;
                    video.src = '';
                    video.load();
                    video.src = srcOriginal;
                }
            });

            // 3. Al hacer clic: Expandir / Activar Modo Teatro
            boton.addEventListener('click', (e) => {
                e.stopPropagation(); // Evita que el clic se confunda con el fondo

                if (boton.classList.contains('expandido')) {
                    cerrarVideoExpandido();
                } else {
                    // Si había otro abierto, lo cierra primero
                    cerrarVideoExpandido();
                    
                    // Expande este botón y activa el fondo oscuro
                    boton.classList.add('expandido');
                    capaOscura.classList.add('activa');
                    
                    // Se asegura de que el video se esté reproduciendo en pantalla grande
                    video.play().catch(e => console.log(e));
                }
            });
        });

        // 4. Si haces clic en la capa oscura (afuera del video), todo vuelve a la normalidad
        capaOscura.addEventListener('click', cerrarVideoExpandido);
    </script>

</body>
</html>
