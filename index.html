<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - 100% CSS</title>
    <!-- Importamos una fuente estilo Pixel / Retro de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* --- ESTILOS GENERALES --- */
        * {
            box-sizing: border-box;
            user-select: none;
            image-rendering: pixelated; /* Fuerza al navegador a no suavizar bordes */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', monospace; /* Fuente Pixel */
            overflow: hidden; 
        }

        /* --- VIDEO DE FONDO --- */
        .video-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1; 
            pointer-events: none;
        }

        /* --- CUADRO PRINCIPAL (MARCO DE MADERA EN CSS) --- */
        .cuadro-interfaz {
            position: relative;
            width: 550px;  
            height: 420px; 
            background-color: #181818; /* Fondo oscuro de la pizarra */
            z-index: 10; 
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            
            /* Bordes de madera pixelados simulados con sombras múltiples */
            border: 12px solid #4a2f1b; /* Madera base media */
            box-shadow: 
                0 0 0 4px #2b1a0e,  /* Borde exterior oscuro */
                inset 0 0 0 4px #6e472b, /* Brillo interno de madera */
                0 20px 50px rgba(0, 0, 0, 0.9); /* Sombra proyectada al fondo */
        }

        /* Título Principal */
        .titulo {
            color: #ffffff;
            font-size: 20px;
            margin-top: 10px;
            margin-bottom: 35px;
            text-align: center;
            text-shadow: 3px 3px #000000;
            letter-spacing: 2px;
        }

        /* Contenedor de cada campo */
        .grupo-campo {
            width: 85%;
            margin-bottom: 25px;
        }

        /* Etiquetas (USUARIO / CONTRASEÑA) */
        .etiqueta {
            color: #df8026; /* Naranja pixel art */
            font-size: 12px;
            margin-bottom: 12px;
            display: block;
            text-shadow: 2px 2px #000;
        }

        /* --- CAJAS DE ENTRADA ESTILO MADERA --- */
        .campo-entrada {
            width: 100%;
            height: 44px;
            background-color: #2b1a0e; /* Fondo madera oscura */
            border: 4px solid #140b05; /* Borde oscuro profundo */
            box-shadow: inset 0 -4px 0 #4a2f1b, inset 0 4px 0 #000; /* Efecto relieve interno */
            outline: none;
            color: #fcd34d; /* Texto dorado */
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            padding: 0 12px;
            user-select: text;
        }

        /* --- CONTENEDOR DE BOTONES --- */
        .contenedor-botones {
            display: flex;
            width: 85%;
            justify-content: space-between;
            margin-top: 15px;
        }

        /* Estilo base para botones estilo RPG */
        .btn {
            width: 46%;
            height: 48px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #ffffff;
            cursor: pointer;
            outline: none;
            text-shadow: 2px 2px #000;
            
            /* Estructura de borde pixelado */
            border: 4px solid #140b05;
            box-shadow: inset -4px -4px 0 rgba(0,0,0,0.4), inset 4px 4px 0 rgba(255,255,255,0.3);
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.96);
            box-shadow: inset 4px 4px 0 rgba(0,0,0,0.4); /* Invierte relieve al presionar */
        }

        /* Botón Iniciar Sesión (Azul) */
        .btn-azul {
            background-color: #0066cc;
            box-shadow: inset -4px -4px 0 #003399, inset 4px 4px 0 #3399ff;
        }
        .btn-azul:hover {
            background-color: #0052a5;
        }

        /* Botón Cancelar (Gris) */
        .btn-gris {
            background-color: #8c8c8c;
            box-shadow: inset -4px -4px 0 #595959, inset 4px 4px 0 #b3b3b3;
        }
        .btn-gris:hover {
            background-color: #737373;
        }

        /* --- PANTALLA DE INTRO (GIF) --- */
        #pantalla-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #gif-intro {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        #contenido-login {
            opacity: 0;
            transition: opacity 1.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE INTRO -->
    <div id="pantalla-intro">
        <img id="gif-intro" src="intro.gif" alt="Cargando...">
    </div>

    <!-- 2. INTERFAZ DE LOGIN (100% CSS) -->
    <div id="contenido-login">
        
        <!-- Video de fondo animado -->
        <video class="video-fondo" src="video_1772677728570.mp4" autoplay loop muted playsinline></video>

        <!-- Cuadro de interfaz generado con puro CSS -->
        <div class="cuadro-interfaz">
            <div class="titulo">INICIO DE SESIÓN</div>

            <form style="width: 100%; display: flex; flex-direction: column; align-items: center;" id="formLogin">
                
                <!-- Campo Usuario -->
                <div class="grupo-campo">
                    <label class="etiqueta">USUARIO:</label>
                    <input type="text" id="usuario" class="campo-entrada" autocomplete="off" required>
                </div>

                <!-- Campo Contraseña -->
                <div class="grupo-campo">
                    <label class="etiqueta">CONTRASEÑA:</label>
                    <input type="password" id="contrasena" class="campo-entrada" required>
                </div>
                
                <!-- Botones -->
                <div class="contenedor-botones">
                    <button type="submit" class="btn btn-azul">INICIAR SESIÓN</button>
                    <button type="button" class="btn btn-gris" onclick="cancelar()">CANCELAR</button>
                </div>
            </form>
        </div>

    </div>

    <!-- 3. LÓGICA DE DIRECCIONAMIENTO -->
    <script>
        // Control de la Intro
        window.addEventListener('load', () => {
            const tiempoDeIntro = 3500; 
            setTimeout(() => {
                document.getElementById('pantalla-intro').style.opacity = '0';
                document.getElementById('pantalla-intro').style.visibility = 'hidden';
                document.getElementById('contenido-login').style.opacity = '1';
            }, tiempoDeIntro);
        });

        // Validación de Acceso
        document.getElementById('formLogin').addEventListener('submit', (e) => {
            e.preventDefault(); 
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('contrasena').value;

            if(user === "admin" && pass === "1234") {
                window.location.href = "pagina_exito.html"; 
            } else {
                window.location.href = "pagina_error.html"; 
            }
        });

        function cancelar() {
            document.getElementById('usuario').value = '';
            document.getElementById('contrasena').value = '';
        }
    </script>

</body>
</html>
